  <!-- automatic processing rail -->
  <g stroke-linecap="round">
    <path d="M44 32h4" stroke="#C9A66B" stroke-width="1.4" opacity=".35"/>
    <path d="M44 36h7" stroke="#C9A66B" stroke-width="1.4" opacity=".65"/>
    <path d="M44 40h4" stroke="#C9A66B" stroke-width="1.4" opacity=".35"/>
    <path d="M52.5 36h8" stroke="#C9A66B" stroke-width="1.8"/>
    <path d="M57.5 32.2L61.8 36l-4.3 3.8" stroke="#C9A66B" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- elevated gold form -->
  <path d="M48 58 L58.5 28h4.2L73 58h-5.6l-2-6.1H55.6L53.6 58H48zm8.2-10.8h8.4L60.6 34.2 56.2 47.2z"
