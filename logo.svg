<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-label="Augmatic Holdings">
  <title>Augmatic — base metal to gold</title>
  <rect width="80" height="80" rx="18" fill="#08090B"/>
  <rect x="1" y="1" width="78" height="78" rx="17" stroke="#C9A66B" stroke-opacity=".28"/>

  <!-- unfinished steel form -->
  <path d="M14 56 L26 22h3.8L41.5 56h-5.8l-2.1-6.4H21.9L19.8 56H14zm8.6-11.2h9.1L27.1 31.4 22.6 44.8z"
